<!DOCTYPE html>
<html lang="nl">

  <title>Schrift & Traditie | Essays over jodendom en christendom</title>
  <style>
    :root{--bg:#f7f5f0;--paper:#fffefa;--ink:#182d31;--muted:#647274;--line:#dcded7;--accent:#9a6b3e;--deep:#173c42;--shade:#eaece5;--radius:16px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}header{background:var(--paper);border-bottom:1px solid var(--line)}.top{max-width:1180px;margin:auto;padding:21px 25px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{text-decoration:none;display:flex;flex-direction:column;line-height:1.13}.brand b{font-size:24px;letter-spacing:-.6px}.brand small{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-top:7px;font-family:Arial,sans-serif}.nav{display:flex;align-items:center;gap:19px;flex-wrap:wrap;font:14px Arial,sans-serif}.nav button{border:none;background:transparent;color:var(--ink);padding:8px 0}.nav button:hover,.nav button.active{color:var(--accent)}.primary{background:var(--deep)!important;color:white!important;border-radius:7px!important;padding:11px 15px!important;border:1px solid var(--deep)!important}.ghost{background:transparent;border:1px solid var(--line);border-radius:7px;padding:10px 15px;color:var(--deep)}.hero{max-width:1180px;margin:auto;padding:78px 25px 62px;display:grid;grid-template-columns:1.35fr .65fr;align-items:center;gap:70px}.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:2.2px;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(40px,5.5vw,74px);line-height:1.08;letter-spacing:-1.8px;font-weight:normal;margin:18px 0}h2{font-weight:normal;font-size:31px;line-height:1.25;margin:0 0 20px}.hero p{font-size:18px;max-width:580px;color:#526166}.hero-art{min-height:295px;background:var(--deep);border-radius:160px 160px 12px 12px;position:relative;display:flex;align-items:center;justify-content:center;color:#e6dfc7;overflow:hidden}.hero-art:before,.hero-art:after{content:'';position:absolute;border:1px solid #81948d;border-radius:150px 150px 9px 9px;inset:20px 22px 0}.hero-art:after{inset:42px 44px 0}.hero-art span{font-size:88px;z-index:1}.hero-art em{position:absolute;bottom:38px;font:12px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;z-index:1}.section{max-width:1180px;margin:auto;padding:25px 25px 75px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:26px}.section-head h2{margin:0}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}.chip{background:transparent;border:1px solid #d6d8d0;border-radius:30px;padding:8px 15px;font:13px Arial,sans-serif;color:var(--ink)}.chip.active{background:var(--deep);border-color:var(--deep);color:white}.search{width:100%;max-width:300px;border:1px solid var(--line);background:white;border-radius:7px;padding:10px 13px;font:14px Arial,sans-serif}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:38px}.articles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.article-card{background:var(--paper);border:1px solid var(--line);padding:27px;border-radius:var(--radius);display:flex;flex-direction:column;min-height:255px}.article-card .category{font:700 11px Arial,sans-serif;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent)}.article-card h3{font-size:25px;line-height:1.25;font-weight:normal;margin:13px 0}.article-card p{font-size:15px;color:#5c6769;margin:0 0 20px;flex:1}.article-card .meta{display:flex;align-items:center;justify-content:space-between;font:12px Arial,sans-serif;color:var(--muted);gap:10px}.article-card a{font:700 13px Arial,sans-serif;color:var(--deep);text-decoration:none}.sidebar{border-top:3px solid var(--accent);padding-top:20px}.sidebar h3{font-size:21px;font-weight:normal;margin:0 0 12px}.sidebar p,.sidebar li{font-size:14px;color:#59686a}.sidebar ul{padding-left:18px}.sidebar section{margin-bottom:30px}.empty{grid-column:1/-1;padding:55px 30px;background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);text-align:center}.empty h3{font-size:25px;font-weight:normal;margin:0}.empty p{font-size:15px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:30px 25px;text-align:center;font:13px Arial,sans-serif;color:var(--muted)}.panel{max-width:800px;margin:55px auto 90px;padding:0 25px}.panel h1{font-size:49px}.panel p{font-size:16px}.article-detail{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(24px,5vw,62px)}.article-detail .lead{font-size:20px;color:#566569}.bodytext{font-size:18px;line-height:1.82;overflow-wrap:anywhere}.bodytext h2{margin-top:34px;font-size:28px}.bodytext h3{font-size:23px;margin-top:27px}.bodytext blockquote{border-left:3px solid var(--accent);margin:20px 0;padding-left:20px;color:#526166}.bodytext a{color:#0c6372}.bodytext p{margin:0 0 19px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.form{background:var(--paper);padding:30px;border:1px solid var(--line);border-radius:var(--radius)}.field{margin-bottom:19px}.field label{display:block;font:700 13px Arial,sans-serif;margin-bottom:8px}.field input,.field select,.field textarea{width:100%;border:1px solid #cdd3ce;border-radius:7px;background:white;padding:12px;font:16px Arial,sans-serif;color:var(--ink)}.field textarea{min-height:340px;resize:vertical;line-height:1.55}.field textarea.short{min-height:95px}.hint{font:12px Arial,sans-serif;color:var(--muted);margin-top:6px}.alert{border:1px solid #e4d4b5;background:#faf2e2;border-radius:8px;padding:14px 17px;font:14px Arial,sans-serif;margin:18px 0}.modal-actions{display:flex;flex-wrap:wrap;gap:11px;align-items:center}.small{font:12px Arial,sans-serif;color:var(--muted)}.hidden{display:none!important}#fileImport{display:none}@media(max-width:850px){.hero{gap:30px;grid-template-columns:1fr .6fr}.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:20px}}@media(max-width:650px){.top{align-items:start;flex-direction:column}.nav{gap:14px}.hero{padding-top:50px;grid-template-columns:1fr}.hero-art{min-height:200px;max-width:260px}.hero-art span{font-size:70px}.articles{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.sidebar{display:block}.panel h1{font-size:38px}.hero h1{font-size:47px}}
    .bodytext h2{margin:36px 0 15px;line-height:1.3;font-weight:normal}.bodytext h3{margin:28px 0 12px;line-height:1.35;font-weight:normal}.bodytext p{margin:0 0 19px}.bodytext ul,.bodytext ol{margin:0 0 22px;padding-left:28px}.bodytext li{margin:8px 0}.bodytext blockquote{margin:24px 0;padding:8px 0 8px 21px;border-left:3px solid var(--accent);color:#526166}.bodytext blockquote p{margin:0}.bodytext a{overflow-wrap:anywhere;text-decoration:underline;text-underline-offset:3px}.bodytext strong{font-weight:700}.bodytext code{font-size:.9em;background:var(--shade);padding:1px 5px;border-radius:4px}
  </style>
</head>
<body>
<header><div class="top"><a class="brand" href="#home"><b>Schrift &amp; Traditie</b><small>Jodendom · Christendom · Essays</small></a><nav class="nav" aria-label="Hoofdnavigatie"><button data-route="home">Home</button><button data-route="articles">Alle essays</button><button data-route="about">Over deze blog</button><a class="primary" style="font:14px Arial,sans-serif;text-decoration:none" href="https://app.pagescms.org/" target="_blank" rel="noopener noreferrer">Beheer essays</a></nav></div></header>
<main id="app"></main><footer>Schrift &amp; Traditie · Ruimte voor kritisch en respectvol onderzoek</footer>
<input type="file" id="fileImport" accept="application/json,.json">
<script id="site-data" type="application/json">{"readonly":true,"posts":[]}</script>
<script>
(() => {'use strict';
const storageKey='schrift-traditie-posts-v1';
const siteData=JSON.parse(document.getElementById('site-data').textContent);
const readonly=Boolean(siteData.readonly);
let posts=readonly?siteData.posts:loadPosts();
const cats=['Jodendom','Christendom','Tekstvergelijking','Messias en profetie','Geschiedenis','Filosofie'];
let currentFilter='Alles',currentSearch='';
const app=document.getElementById('app');
function loadPosts(){try{const v=JSON.parse(localStorage.getItem(storageKey));return Array.isArray(v)?v:siteData.posts}catch(e){return siteData.posts}}
function save(){if(!readonly)localStorage.setItem(storageKey,JSON.stringify(posts))}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateFmt(s){return new Date(s+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})}
function inlineMd(input){
  let s=escapeHtml(input);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  return s;
}
function md(input){
  // Maak ook handmatig geplakte teksten leesbaar wanneer een kop aan de alinea vastzit.
  const source=String(input??'').replace(/\r\n?/g,'\n').replace(/([^\n])([ \t]*#{2,3}[ \t]+)/g,'$1\n\n$2');
  const lines=source.split('\n');
  const out=[];
  let paragraph=[],listType='',listItems=[],quote=[];
  function flushParagraph(){if(paragraph.length){out.push('<p>'+inlineMd(paragraph.join(' ').trim())+'</p>');paragraph=[];}}
  function flushList(){if(listType){out.push('<'+listType+'>'+listItems.map(item=>'<li>'+inlineMd(item)+'</li>').join('')+'</'+listType+'>');listItems=[];listType='';}}
  function flushQuote(){if(quote.length){out.push('<blockquote><p>'+inlineMd(quote.join(' '))+'</p></blockquote>');quote=[];}}
  function flushAll(){flushParagraph();flushList();flushQuote();}
  for(const line of lines){
    const t=line.trim();
    if(!t){flushAll();continue;}
    const heading=t.match(/^(#{1,3})\s+(.+)$/);
    if(heading){flushAll();const level=Math.max(2,heading[1].length);out.push('<h'+level+'>'+inlineMd(heading[2])+'</h'+level+'>');continue;}
    const quoteLine=t.match(/^>\s?(.*)$/);
    if(quoteLine){flushParagraph();flushList();quote.push(quoteLine[1]);continue;}
    const listLine=t.match(/^(?:([-*+])|(\d+)\.)\s+(.+)$/);
    if(listLine){flushParagraph();flushQuote();const kind=listLine[2]?'ol':'ul';if(listType&&listType!==kind)flushList();listType=kind;listItems.push(listLine[3]);continue;}
    flushList();flushQuote();paragraph.push(t);
  }
  flushAll();
  return out.join('\n');
}
function sorted(){return posts.filter(p=>p.status==='published').sort((a,b)=>b.date.localeCompare(a.date))}
function card(p){return `<article class="article-card"><span class="category">${escapeHtml(p.category)}</span><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.summary||'Lees dit essay.')}</p><div class="meta"><span>${dateFmt(p.date)}</span><a href="#post/${encodeURIComponent(p.id)}">Lees essay →</a></div></article>`}
function layout(){const filtered=sorted().filter(p=>(currentFilter==='Alles'||p.category===currentFilter)&&[p.title,p.summary,p.body].join(' ').toLowerCase().includes(currentSearch.toLowerCase()));return `<section class="section" id="essays"><div class="section-head"><div><div class="eyebrow">De verzameling</div><h2>Essays &amp; onderzoek</h2></div><input id="search" class="search" type="search" aria-label="Zoek essays" placeholder="Zoek in essays..." value="${escapeHtml(currentSearch)}"></div><div class="filters">${['Alles',...cats].map(c=>`<button class="chip ${currentFilter===c?'active':''}" data-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}</div><div class="layout"><div class="articles">${filtered.length?filtered.map(card).join(''):`<div class="empty"><h3>${sorted().length?'Geen essays gevonden':'De eerste essays verschijnen binnenkort'}</h3><p>${sorted().length?'Pas de zoekterm of categorie aan.':'Hier verschijnen de gepubliceerde artikelen over jodendom en christendom.'}</p>${readonly?'':'<button class="primary" data-route="new">Schrijf je eerste essay</button>'}</div>`}</div><aside class="sidebar"><section><h3>Over dit project</h3><p>Een plek voor het vergelijken van de Joodse en christelijke tradities, met aandacht voor oorspronkelijke teksten, context en verschillende interpretaties.</p></section><section><h3>Onderzoeksthema’s</h3><ul><li>Hebreeuwse Tenach en Nieuwe Testament</li><li>Joodse en christelijke exegese</li><li>Profetie en messiasverwachting</li><li>Geschiedenis van vertalingen</li></ul></section>${readonly?'':`<section><h3>Beheer</h3><p>Je teksten staan in deze browser opgeslagen. Maak regelmatig een back-up.</p><div class="toolbar"><button class="ghost" id="backup">Back-up opslaan</button><button class="ghost" id="import">Back-up inlezen</button><button class="ghost" id="publish">Publicatieversie maken</button></div></section>`}</aside></div></section>`}
function home(){return `<section class="hero"><div><div class="eyebrow">Onafhankelijk Bijbelonderzoek</div><h1>Twee tradities.<br>Een gedeelde Schrift.</h1><p>Essays over de Tenach, het Nieuwe Testament en de verschillende interpretaties binnen het jodendom en christendom.</p><div class="toolbar"><button class="primary" data-route="articles">Bekijk de essays</button>${readonly?'':'<button class="ghost" data-route="new">Schrijf een essay</button>'}</div></div><div class="hero-art" aria-hidden="true"><span>א&nbsp;Ω</span><em>Tekst · Context · Uitleg</em></div></section>${layout()}`}
function about(){return `<div class="panel"><div class="eyebrow">Over deze blog</div><h1>Onderzoek, vergelijking en eigen reflectie.</h1><div class="article-detail"><p>Deze blog onderzoekt de overeenkomsten en verschillen tussen jodendom en christendom. Centraal staan de bronteksten, hun historische context en de uiteenlopende uitlegtradities.</p><p>De essays geven ruimte aan beide tradities en maken onderscheid tussen brontekst, interpretatie en persoonlijke conclusie.</p>${readonly?'':'<p>Deze introductie is een starttekst in de website. Je past haar later rechtstreeks aan in het HTML-bestand, of we voegen een aparte pagina-editor toe.</p>'}</div></div>`}
function postView(id){const p=posts.find(x=>x.id===id);if(!p)return `<div class="panel"><h1>Essay niet gevonden</h1><a href="#articles">Terug naar essays</a></div>`;if(readonly&&p.status!=='published')return '';return `<div class="panel"><div class="eyebrow">${escapeHtml(p.category)} · ${dateFmt(p.date)} ${p.status==='draft'?'· Concept':''}</div><h1>${escapeHtml(p.title)}</h1><div class="article-detail"><div class="bodytext">${md(p.body)}</div></div><div class="toolbar"><button class="ghost" data-route="articles">← Alle essays</button>${readonly?'':`<button class="primary" data-route="edit/${encodeURIComponent(p.id)}">Bewerk essay</button><button class="ghost" data-delete="${escapeHtml(p.id)}">Verwijderen</button>`}</div></div>`}
function editor(id){if(readonly)return about();const p=id?posts.find(x=>x.id===id):null;if(id&&!p)return '<div class="panel"><h1>Essay niet gevonden</h1></div>';const today=new Date().toISOString().slice(0,10);return `<div class="panel"><div class="eyebrow">${p?'Essay bewerken':'Een nieuw essay'}</div><h1>${p?'Bewerk je essay':'Schrijf je eigen uitleg.'}</h1><div class="alert">Alle wijzigingen worden lokaal in deze browser opgeslagen. Gebruik de back-upfunctie om je teksten veilig te bewaren.</div><form id="postForm" class="form"><div class="field"><label for="title">Titel</label><input id="title" required maxlength="180" value="${escapeHtml(p?.title||'')}" placeholder="Bijvoorbeeld: Exodus 3:14, Ik ben of Ik zal zijn?"></div><div class="field"><label for="category">Onderwerp</label><select id="category">${cats.map(c=>`<option ${p?.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div><div class="field"><label for="date">Datum</label><input id="date" type="date" required value="${escapeHtml(p?.date||today)}"></div><div class="field"><label for="summary">Korte inleiding</label><textarea class="short" id="summary" maxlength="450" placeholder="Vertel in twee zinnen waar je essay over gaat.">${escapeHtml(p?.summary||'')}</textarea></div><div class="field"><label for="body">Je essay</label><textarea id="body" required placeholder="Schrijf hier je eigen uitleg...">${escapeHtml(p?.body||'')}</textarea><div class="hint">Opmaak: ## Tussenkop, **vet**, *cursief*, &gt; citaat, [linktekst](https://voorbeeld.nl). Lege regel voor een nieuwe alinea.</div></div><div class="field"><label for="status">Status</label><select id="status"><option value="draft" ${p?.status!=='published'?'selected':''}>Concept (niet zichtbaar op de blog)</option><option value="published" ${p?.status==='published'?'selected':''}>Gepubliceerd (zichtbaar op de blog)</option></select></div><div class="modal-actions"><button class="primary" type="submit">Essay opslaan</button><button class="ghost" type="button" data-route="articles">Annuleren</button></div></form></div>`}
function bind(){document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',()=>location.hash='#'+el.dataset.route));document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{currentFilter=el.dataset.filter;render();document.getElementById('essays')?.scrollIntoView()}));document.getElementById('search')?.addEventListener('input',e=>{const pos=e.target.selectionStart;currentSearch=e.target.value;const list=document.querySelector('.articles');const filtered=sorted().filter(p=>(currentFilter==='Alles'||p.category===currentFilter)&&[p.title,p.summary,p.body].join(' ').toLowerCase().includes(currentSearch.toLowerCase()));list.innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty"><h3>Geen essays gevonden</h3></div>';e.target.focus();e.target.setSelectionRange(pos,pos)});document.getElementById('postForm')?.addEventListener('submit',e=>{e.preventDefault();const id=decodeURIComponent((location.hash.match(/^#edit\/(.+)$/)||[])[1]||'');let p=id?posts.find(x=>x.id===id):null;const data={title:document.getElementById('title').value.trim(),category:document.getElementById('category').value,date:document.getElementById('date').value,summary:document.getElementById('summary').value.trim(),body:document.getElementById('body').value.trim(),status:document.getElementById('status').value};if(!data.title||!data.body)return;if(p)Object.assign(p,data);else{p={id:'essay-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),...data};posts.push(p)}save();location.hash='#post/'+encodeURIComponent(p.id)});document.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{if(confirm('Dit essay definitief uit deze browser verwijderen? Maak eerst een back-up als je het wilt bewaren.')){posts=posts.filter(p=>p.id!==el.dataset.delete);save();location.hash='#articles'}}));document.getElementById('backup')?.addEventListener('click',()=>download('mijn-essays-backup.json',JSON.stringify({format:'schrift-traditie-v1',posts},null,2),'application/json'));document.getElementById('import')?.addEventListener('click',()=>document.getElementById('fileImport').click());document.getElementById('publish')?.addEventListener('click',publishSite)}
function download(name,content,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function publishSite(){const publicData={readonly:true,posts:posts.filter(p=>p.status==='published')};let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;html=html.replace(/<script id="site-data" type="application\/json">[\s\S]*?<\/script>/,'<script id="site-data" type="application/json">'+JSON.stringify(publicData).replace(/</g,'\\u003c')+'<\/script>');download('index.html',html,'text/html;charset=utf-8');alert('De publieke index.html is gedownload. Upload dit bestand naar een statische webhost om je gepubliceerde essays online te zetten. Je concepten worden niet meegestuurd.')}
document.getElementById('fileImport').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.format!=='schrift-traditie-v1'||!Array.isArray(obj.posts)||obj.posts.length>10000||!obj.posts.every(p=>p&&typeof p.id==='string'&&typeof p.title==='string'&&typeof p.body==='string'&&typeof p.date==='string'&&typeof p.category==='string'&&['draft','published'].includes(p.status)))throw Error();if(confirm('Deze back-up vervangt alle huidige essays in deze browser. Doorgaan?')){posts=obj.posts;save();location.hash='#articles';render()}}catch(e){alert('Geen geldige back-up voor deze blog.')}e.target.value=''});
function render(){const path=decodeURIComponent(location.hash.slice(1)||'home');document.querySelectorAll('.editor-only').forEach(el=>el.classList.toggle('hidden',readonly));if(path==='home')app.innerHTML=home();else if(path==='articles')app.innerHTML=layout();else if(path==='about')app.innerHTML=about();else if(path==='new')app.innerHTML=editor();else if(path.startsWith('edit/'))app.innerHTML=editor(path.slice(5));else if(path.startsWith('post/'))app.innerHTML=postView(path.slice(5));else app.innerHTML=home();bind()}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
})();
</script>
</body></html>
